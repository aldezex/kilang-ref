}

  :root:not([data-theme="light"]) {

html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.6; font-weight: var(--text-weight); font-optical-sizing: auto; font-variant-numeric: lining-nums; }
.app { display: grid; grid-template-columns: 288px minmax(0, 1fr); min-height: 100%; }
/* How far down the page the reader is: a line that never takes a click and never moves anything. */
.reading-line { position: fixed; inset: env(safe-area-inset-top, 0px) 0 auto; z-index: 20; height: 2px; background: var(--red); transform: scaleX(0); transform-origin: 0 50%; pointer-events: none; }
/* ---------- table of contents: the current part open, the others one line each, and the page's scrollbar the only one ---------- */
.toc { box-sizing: border-box; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; scrollbar-width: none;
  font-size: var(--toc-size); line-height: var(--toc-line); padding-block: var(--toc-top) 12px; border-right: 1px solid var(--rule);
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 18px; }
.toc::-webkit-scrollbar { display: none; }
.brand { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; margin-bottom: var(--toc-brand-gap); color: inherit; text-decoration: none; }
.brand b { font-size: 42px; font-weight: 500; line-height: 1; color: var(--red); }
.brand span { color: var(--ink-soft); font-size: 13px; line-height: 1.3; text-wrap: balance; }
.overall { display: grid; gap: 2px; margin-bottom: var(--toc-overall-gap); padding-bottom: 10px; border-bottom: 1px solid var(--rule); font-family: var(--font-ui); }
.overall .line { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 12.5px; }
.bar { height: 2px; margin-bottom: 7px; background: var(--rule); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--red); width: 0; }
.part > summary { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; padding: var(--toc-row) 18px var(--toc-row) 0; color: var(--ink-soft); cursor: pointer; list-style: none; }
.part > summary::-webkit-details-marker { display: none; }
.part > summary:hover { color: var(--ink); }
.part > summary .num { text-align: right; font-variant-numeric: tabular-nums; }
.part > summary .name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.part > summary::after { content: ""; position: absolute; right: 0; top: calc(var(--toc-row) + 5.5px); width: 12px; height: 12px; background-color: currentColor; transform: rotate(-90deg);
  -webkit-mask: var(--i-chevron) center / contain no-repeat; mask: var(--i-chevron) center / contain no-repeat; }
.part[open] > summary { color: var(--red); font-weight: 600; }
.part[open] > summary .name { white-space: normal; }
.part[open] > summary::after { transform: none; }
.part-facts { margin: 0 0 2px 36px; font-family: var(--font-ui); font-size: 12px; color: var(--ink-soft); }
.part[open] { margin-block: var(--toc-open-gap); }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.toc li a, .toc li .soon { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; align-items: baseline; padding: var(--toc-row) 0; color: var(--ink); text-decoration: none; }
.toc li a:hover { color: var(--red); }
.toc li a[aria-current="page"] { color: var(--red); font-weight: 600; }
.toc li a[aria-current="page"] .num { box-shadow: -2px 0 0 var(--red); }
.toc li .soon { color: var(--ink-soft); }
.toc .num { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-soft); }
.toc a[aria-current="page"] .num { color: inherit; }
.toc .done .num::before { content: "✓ "; font-size: 0.85em; }
.toc code { font-family: var(--font-code); font-size: 0.86em; }
.toc .loading { color: var(--ink-soft); }
/* ---------- reading column ---------- */
main { min-width: 0; padding-block: 32px 96px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.page { max-width: var(--measure); margin: 0 auto; }
/* The opener: the part and the number in red, the title, one line of facts and the milestone. No band and no box. */
.chapter-head { margin: 0 0 var(--s-opener-below); padding-top: var(--s-opener-above); }
.chapter-head p { margin: 0; }
.eyebrow { display: block; font-family: var(--font-ui); font-size: 14px; font-weight: 500; line-height: 22px; color: var(--red); }
.chapter-num { display: block; margin-top: var(--s-num-above); font-size: var(--size-num); font-weight: 300; line-height: 1; color: var(--red); }
.chapter-head h1 { margin: var(--s-h1-above) 0 0; font-size: 44px; font-weight: 400; line-height: 1.14; letter-spacing: -0.008em; text-wrap: balance; }
.chapter-head .facts { margin-top: var(--s-facts-above); font-family: var(--font-ui); font-size: var(--size-facts); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.chapter-head .milestone { margin-top: var(--s-milestone-above); font-family: var(--font-ui); font-size: var(--size-facts); line-height: var(--line-facts); color: var(--ink-soft); }
.milestone span { font-weight: 600; color: var(--ink); }
/* Code in a title is the size of its text: a mono is wide and dark, so it is set smaller, lighter and with closer words. */
.page h1 code { font-size: 0.84em; font-weight: 300; letter-spacing: -0.02em; word-spacing: -0.3em; }
.page h2 code, .card b code { font-size: 0.88em; font-weight: 400; word-spacing: -0.2em; }
.page h3 code, .page h4 code { font-size: 0.88em; font-weight: 500; word-spacing: -0.2em; }
.milestone code, .card small code { font-size: 0.92em; }
.page h2, .page h3, .page h4 { text-wrap: balance; color: var(--ink); }
.page h2 { font-size: var(--size-h2); font-weight: var(--weight-h2); line-height: 1.2; margin: var(--s-section) 0 var(--s-section-below); }
.page > h2 { padding-top: var(--s-rule-below); border-top: 2px solid var(--red); }
/* The air over a section. It stands apart from the heading because a heading that clears a tall aside loses its own margin. */
.section-break { display: none; }
.page h3 { font-size: var(--size-h3); font-weight: 600; line-height: 1.3; margin: var(--s-h3) 0 var(--s-h3-below); }
.page h4 { font-size: var(--size-h4); font-weight: 600; line-height: 1.35; margin: var(--s-h4) 0 var(--s-h4-below); }
.page p, .page li { hyphens: auto; }
.page strong { font-weight: 600; }
.page p { margin: 0 0 var(--s-para); }
.page ul, .page ol { margin: 0 0 var(--s-para); padding-left: 1.25em; }
.page li + li { margin-top: var(--s-li); }
.page li::marker { color: var(--red); }
.page a { color: var(--red); text-underline-offset: 2px; text-decoration-thickness: 1px; }
.page a:hover { color: var(--red-deep); }
.page code { font-family: var(--font-code); font-size: 0.84em; word-spacing: -0.1em; }
.page pre code { font-size: var(--size-code); word-spacing: normal; }
/* The reader types what the page shows: no ligature may turn |> into a triangle or => into an arrow. */
code { font-variant-ligatures: none; }
.page blockquote { margin: 0 0 var(--s-para); padding-left: 14px; border-left: 2px solid var(--rule-strong); color: var(--ink-soft); }
.page hr { border: 0; border-top: 1px solid var(--rule); margin: var(--s-hr) 0; }
/* tables: a rule above, one under the head, one below, and the text of the first column on the edge of the page */
.table-wrap { overflow-x: auto; margin: var(--s-block) 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
.page table { border-collapse: collapse; width: 100%; font-family: var(--font-ui); font-size: var(--size-table); line-height: var(--line-table); }
.page th, .page td { text-align: left; vertical-align: top; padding: var(--cell-y) var(--cell-x); border-bottom: 1px solid var(--rule); }
.page th:first-child, .page td:first-child { padding-left: 0; }
.page th:last-child, .page td:last-child { padding-right: 0; }
.page th { font-weight: 600; color: var(--ink); border-bottom-color: var(--rule-strong); }
.page tbody tr:last-child td { border-bottom: 0; }
.page td code, .page th code { font-size: var(--size-table-code); }
/* code blocks: the file they come from and the tag they were taken at */
figure.code { margin: var(--s-block) 0; overflow: hidden; background: var(--code-bg); }
figure.code figcaption { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: baseline;
  font-family: var(--font-ui); font-size: 12.5px; color: var(--ink-soft); padding: var(--code-cap-y) var(--code-x) 0; }
figure.code figcaption .path { font-family: var(--font-code); color: var(--ink-soft); overflow-wrap: anywhere; }
figure.code pre { margin: 0; padding: var(--code-top) var(--code-x) var(--code-bottom); overflow-x: auto; color: var(--code-ink); }
.copy { font: inherit; font-size: 12.5px; color: var(--ink-soft); background: none; border: 0; padding: 0 0 0 8px; cursor: pointer; }
.copy:hover { color: var(--red); text-decoration: underline; text-underline-offset: 2px; }
.hljs-keyword, .hljs-selector-tag, .hljs-built_in.hljs-keyword { color: var(--tok-key); }
.hljs-string, .hljs-regexp { color: var(--tok-str); }
.hljs-comment, .hljs-quote { color: var(--tok-com); font-style: italic; }
.hljs-number, .hljs-literal { color: var(--tok-num); }
.hljs-type, .hljs-title, .hljs-title.class_, .hljs-title.function_, .hljs-built_in { color: var(--tok-type); }
.hljs-meta { color: var(--tok-com); }
.hljs-addition { background: var(--mark-add); }
.hljs-deletion { background: var(--mark-del); }
/* containers: exercises, solutions, comparisons, notes. All of them are one neutral box or one neutral line. Each kind
   sets --icon, and --c when it is the reader's to act on. The icon is a mask, so it takes the colour of its label in both
   themes; it lives in the styles because the text of a label or a summary has to stay what it is. */
.box-label > span:first-child::before, details.fold > summary::before, details.fold > summary::after {
  content: ""; display: inline-block; width: 15px; height: 15px; background-color: currentColor;
  -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat;
}
.box { --c: var(--ink-soft); --r: var(--rule-strong); --icon: var(--i-note); margin: var(--s-block) 0; padding: var(--box-top) var(--box-right) var(--box-bottom) var(--box-left); border-left: 2px solid var(--r); background: var(--tint); }
.box > :first-child { margin-top: 0; }
.box > :last-child { margin-bottom: 0; }
.box-label { font-family: var(--font-ui); font-size: 13px; line-height: 1.35; font-weight: 600; color: var(--c); margin-bottom: var(--box-label-gap); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.box-label > span:first-child::before { margin-right: 6px; vertical-align: -3px; }
.box > .box-label + * { margin-top: 0; }
.box.note { --icon: var(--i-note); }
.box.from { --icon: var(--i-from); }
.box.bug { --c: var(--red); --r: var(--red); --icon: var(--i-bug); }
.box.exercise { --c: var(--red); --r: var(--red); --icon: var(--i-exercise); }
.box.exercise.is-done { --c: var(--ink-soft); --r: var(--rule-strong); --icon: var(--i-check); }
.box.review { --c: var(--ink); --r: var(--ink); --icon: var(--i-review); }
.done-toggle { display: inline-flex; gap: 6px; align-items: center; font-family: var(--font-ui); font-size: 13px; font-weight: 400; color: var(--ink-soft); cursor: pointer; }
.done-toggle input { accent-color: var(--red); width: 14px; height: 14px; margin: 0; }
details.fold { --icon: var(--i-more); margin: var(--s-block) 0; border-block: 1px solid var(--rule); }
details.fold + details.fold { margin-top: calc(-1 * var(--s-block) - 1px); }
details.fold.more { --icon: var(--i-more); }
details.fold.long { --icon: var(--i-code); }
details.fold.reftest { --icon: var(--i-flask); }

    // The chapter you are already in: its link changes no hash, so it takes you back to the top of the chapter.
    if (ev.target.closest && ev.target.closest('.toc a[aria-current="page"]')) {
      jumpToTop();
      return;
    }
    const copy = ev.target.closest && ev.target.closest("button.copy");
    if (copy) {
      const pre = copy.closest("figure").querySelector("pre");
      navigator.clipboard.writeText(pre.innerText).then(() => { copy.textContent = "Copiado"; setTimeout(() => (copy.textContent = "Copiar"), 1500); })
        .catch(() => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); });
      return;
    }
    if (ev.target.id === "mark-read" && state.current) {
      const p = chapterProgress(state.current);
      p.read = !p.read;
      persist(state.current);
      refreshChapterMarks(); renderToc();
    }
  });
  // A part opened by hand stays open when the contents are drawn again; opening one closes the others (name="toc-parts").
  document.addEventListener("toggle", (ev) => {
    if (ev.target.matches && ev.target.matches("details.fold")) paintReadingLine();
    if (!ev.target.matches || !ev.target.matches("details.part")) return;
    if (ev.target.open) state.openPart = ev.target.dataset.part;
    else if (state.openPart === ev.target.dataset.part) state.openPart = null;
  }, true);
  function route() {
    const m = /^#ch(\d{2})$/.exec(location.hash);
    if (m) renderChapter(Number(m[1])); else renderWelcome();
  }
  window.addEventListener("hashchange", route);
  // j and k go to the next and the previous section. A field keeps its letters, and so does a shortcut of the browser.
  document.addEventListener("keydown", (ev) => {
    if ((ev.key !== "j" && ev.key !== "k") || ev.ctrlKey || ev.metaKey || ev.altKey || ev.shiftKey || ev.isComposing || ev.defaultPrevented) return;
    if (!state.current || !state.sections.length) return;
    const field = ev.target.closest && ev.target.closest("input, textarea, select, [contenteditable]");
    if (field) return;
    ev.preventDefault();
    const tops = state.sections.map((s) => $(s.id).getBoundingClientRect().top);
    const held = jump && jump.y === null ? jump.index : -1;
    const to = stepSection(tops, ev.key === "j", held);
    if (to >= 0) jumpTo(to);
    else if (ev.key === "k") jumpToTop();
  });
  // A browser fires scroll at most once per frame, and this only reads the tops of a few headings.
  function onScroll() { paintReadingLine(); markSection(); }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("scrollend", settleJumpIfLanded);
  // The reader's own hand ends a jump at once: nothing holds the page or the mark against the wheel.
  for (const type of ["wheel", "touchstart"]) window.addEventListener(type, () => { jump = null; }, { passive: true });
  window.addEventListener("resize", () => { paintReadingLine(); markSection(true); });

  // ---------- boot ----------
  async function boot() {
    state.progress = loadLocal();
    window.matchMedia(MARGIN_QUERY).addEventListener("change", (ev) => placeAsides($("page"), ev.matches));
    try {
      const [outline, manifest] = await Promise.all([
        fetch("book/outline.json").then((r) => r.json()),
        fetch("book/manifest.json").then((r) => r.json()),
      ]);
      state.outline = outline; state.manifest = manifest;
      const counts = outline.exercises || {};
      for (const c of manifest.chapters) state.available.set(c.chapter, Object.assign({ exercises: counts[String(c.chapter)] || 0 }, c));
    } catch (e) {
      $("page").innerHTML = `<p class="status">No se pudo cargar el índice del libro (${esc(e.message)}). Recarga la página.</p>`;
      return;
    }
    route();
    connectStore().then(() => { syncNote(); refreshChapterMarks(); renderOverall(); });
  }
  boot();
})();
</script>
