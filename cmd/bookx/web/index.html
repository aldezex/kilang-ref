/* Layout: one grid. A column for the table of contents, then the page: a text column and a margin column for the asides.

html, body { height: 100%; }

.app { display: grid; grid-template-columns: 288px minmax(0, 1fr); min-height: 100%; }
/* ---------- table of contents: the current part open, the others one line each, and the page's scrollbar the only one ---------- */
.toc { box-sizing: border-box; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; scrollbar-width: none;
  font-size: 14.5px; line-height: 1.28; padding-block: 34px 12px; border-right: 1px solid var(--rule);
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 18px; }
.toc::-webkit-scrollbar { display: none; }
.brand { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; margin-bottom: 16px; }
.brand b { font-size: 42px; font-weight: 500; line-height: 1; color: var(--red); }
.brand span { color: var(--ink-soft); font-size: 13px; line-height: 1.3; text-wrap: balance; }
.overall { display: grid; gap: 2px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); font-family: var(--font-ui); }
.overall .line { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 12.5px; }

.bar i { display: block; height: 100%; background: var(--red); width: 0; }
.part > summary { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; padding: 1.5px 18px 1.5px 0; color: var(--ink-soft); cursor: pointer; list-style: none; }
.part > summary::-webkit-details-marker { display: none; }
.part > summary:hover { color: var(--ink); }
.part > summary .num { text-align: right; font-variant-numeric: tabular-nums; }
.part > summary .name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.part > summary::after { content: ""; position: absolute; right: 0; top: 7px; width: 12px; height: 12px; background-color: currentColor; transform: rotate(-90deg);
  -webkit-mask: var(--i-chevron) center / contain no-repeat; mask: var(--i-chevron) center / contain no-repeat; }
.part[open] > summary { color: var(--red); font-weight: 600; }
.part[open] > summary .name { white-space: normal; }
.part[open] > summary::after { transform: none; }
.part-facts { margin: 0 0 2px 36px; font-family: var(--font-ui); font-size: 12px; color: var(--ink-soft); }
.part[open] { margin-block: 2px 5px; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.toc li a, .toc li .soon { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 1.5px 0; color: var(--ink); text-decoration: none; }
.toc li a:hover { color: var(--red); }
.toc li a[aria-current="page"] { color: var(--red); font-weight: 600; }
.toc li a[aria-current="page"] .num { box-shadow: -2px 0 0 var(--red); }
.toc li .soon { color: var(--ink-soft); }
.toc .num { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-soft); }
.toc a[aria-current="page"] .num { color: inherit; }
.toc .done .num::before { content: "✓ "; font-size: 0.85em; }
.toc code { font-family: var(--font-code); font-size: 0.86em; }
.toc .loading { color: var(--ink-soft); }
/* ---------- reading column ---------- */
main { min-width: 0; padding-block: 32px 96px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.page { max-width: var(--measure); margin: 0 auto; }
/* The opener: the part and the number in red, the title, one line of facts and the milestone. No band and no box. */
.chapter-head { margin: 0 0 44px; }
.chapter-head p { margin: 0; }
.eyebrow { display: block; font-family: var(--font-ui); font-size: 14px; font-weight: 500; line-height: 22px; color: var(--red); }
.chapter-num { display: block; margin-top: 6px; font-size: 84px; font-weight: 300; line-height: 1; color: var(--red); }
.chapter-head h1 { margin: 10px 0 0; font-size: 44px; font-weight: 400; line-height: 1.14; letter-spacing: -0.008em; text-wrap: balance; }
.chapter-head .facts { margin-top: 18px; font-family: var(--font-ui); font-size: 14px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.chapter-head .milestone { margin-top: 4px; font-family: var(--font-ui); font-size: 14px; line-height: 1.5; color: var(--ink-soft); }
.milestone span { font-weight: 600; color: var(--ink); }
/* Code in a title is the size of its text: a mono is wide and dark, so it is set smaller, lighter and with closer words. */
.page h1 code { font-size: 0.84em; font-weight: 300; letter-spacing: -0.02em; word-spacing: -0.3em; }
.page h2 code, .card b code { font-size: 0.88em; font-weight: 400; word-spacing: -0.2em; }
.page h3 code, .page h4 code { font-size: 0.88em; font-weight: 500; word-spacing: -0.2em; }
.milestone code, .card small code { font-size: 0.92em; }
.page h2, .page h3, .page h4 { text-wrap: balance; color: var(--ink); }
.page h2 { font-size: 29px; font-weight: 500; line-height: 1.2; margin: 52px 0 14px; }
.page > h2 { padding-top: 16px; border-top: 2px solid var(--red); }
.page h3 { font-size: 22px; font-weight: 600; line-height: 1.3; margin: 34px 0 8px; }
.page h4 { font-size: 17px; font-weight: 600; line-height: 1.35; margin: 24px 0 6px; }
.page p, .page li { hyphens: auto; }
.page strong { font-weight: 600; }
.page p { margin: 0 0 0.9em; }
.page ul, .page ol { margin: 0 0 0.9em; padding-left: 1.25em; }
.page li + li { margin-top: 0.2em; }
.page li::marker { color: var(--red); }
.page a { color: var(--red); text-underline-offset: 2px; text-decoration-thickness: 1px; }
.page a:hover { color: var(--red-deep); }
.page code { font-family: var(--font-code); font-size: 0.84em; word-spacing: -0.1em; }
.page pre code { font-size: 13.5px; word-spacing: normal; }
/* The reader types what the page shows: no ligature may turn |> into a triangle or => into an arrow. */
code { font-variant-ligatures: none; }
.page blockquote { margin: 0 0 0.9em; padding-left: 14px; border-left: 2px solid var(--rule-strong); color: var(--ink-soft); }
.page hr { border: 0; border-top: 1px solid var(--rule); margin: 32px 0; }
/* tables: a rule above, one under the head, one below, and the text of the first column on the edge of the page */
.table-wrap { overflow-x: auto; margin: 22px 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
.page table { border-collapse: collapse; width: 100%; font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
.page th, .page td { text-align: left; vertical-align: top; padding: 7px 14px; border-bottom: 1px solid var(--rule); }
.page th:first-child, .page td:first-child { padding-left: 0; }
.page th:last-child, .page td:last-child { padding-right: 0; }
.page th { font-weight: 600; color: var(--ink); border-bottom-color: var(--rule-strong); }
.page tbody tr:last-child td { border-bottom: 0; }
.page td code, .page th code { font-size: 12.5px; }
/* code blocks: the file they come from and the tag they were taken at */
figure.code { margin: 22px 0; overflow: hidden; background: var(--code-bg); }
figure.code figcaption { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: baseline;
  font-family: var(--font-ui); font-size: 12.5px; color: var(--ink-soft); padding: 8px 14px 0; }
figure.code figcaption .path { font-family: var(--font-code); color: var(--ink-soft); overflow-wrap: anywhere; }
figure.code pre { margin: 0; padding: 8px 14px 13px; overflow-x: auto; color: var(--code-ink); }
.copy { font: inherit; font-size: 12.5px; color: var(--ink-soft); background: none; border: 0; padding: 0 0 0 8px; cursor: pointer; }
.copy:hover { color: var(--red); text-decoration: underline; text-underline-offset: 2px; }
.hljs-keyword, .hljs-selector-tag, .hljs-built_in.hljs-keyword { color: var(--tok-key); }
.hljs-string, .hljs-regexp { color: var(--tok-str); }
.hljs-comment, .hljs-quote { color: var(--tok-com); font-style: italic; }
.hljs-number, .hljs-literal { color: var(--tok-num); }
.hljs-type, .hljs-title, .hljs-title.class_, .hljs-title.function_, .hljs-built_in { color: var(--tok-type); }
.hljs-meta { color: var(--tok-com); }
.hljs-addition { background: var(--mark-add); }
.hljs-deletion { background: var(--mark-del); }
/* containers: exercises, solutions, comparisons, notes. All of them are one neutral box or one neutral line. Each kind
   sets --icon, and --c when it is the reader's to act on. The icon is a mask, so it takes the colour of its label in both
   themes; it lives in the styles because the text of a label or a summary has to stay what it is. */
.box-label > span:first-child::before, details.fold > summary::before, details.fold > summary::after {
  content: ""; display: inline-block; width: 15px; height: 15px; background-color: currentColor;
  -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat;
}
.box { --c: var(--ink-soft); --r: var(--rule-strong); --icon: var(--i-note); margin: 22px 0; padding: 11px 16px 12px 14px; border-left: 2px solid var(--r); background: var(--tint); }
.box > :first-child { margin-top: 0; }
.box > :last-child { margin-bottom: 0; }
.box-label { font-family: var(--font-ui); font-size: 13px; line-height: 1.35; font-weight: 600; color: var(--c); margin-bottom: 5px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.box-label > span:first-child::before { margin-right: 6px; vertical-align: -3px; }
.box > .box-label + * { margin-top: 0; }
.box.note { --icon: var(--i-note); }
.box.from { --icon: var(--i-from); }
.box.bug { --c: var(--red); --r: var(--red); --icon: var(--i-bug); }
.box.exercise { --c: var(--red); --r: var(--red); --icon: var(--i-exercise); }
.box.exercise.is-done { --c: var(--ink-soft); --r: var(--rule-strong); --icon: var(--i-check); }
.box.review { --c: var(--ink); --r: var(--ink); --icon: var(--i-review); }

.done-toggle input { accent-color: var(--red); width: 14px; height: 14px; margin: 0; }
details.fold { --icon: var(--i-more); margin: 22px 0; border-block: 1px solid var(--rule); }

.page summary code { font-size: 0.92em; }

/* The home page is the contents page of the book: one row per chapter, the title in the text column and its milestone beside it. */

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(() => {
  "use strict";
  // Progress keys carry the edition, so marks from another edition never show up here.
  const EDITION = "go";
  const state = { outline: null, manifest: null, available: new Map(), progress: {}, chapterCache: new Map(), current: null, sections: [], openPart: null };
  const store = { db: null, uid: null };
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const key = (n) => EDITION + "-ch" + pad(n);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // The titles and the milestones are plain text with `code` spans in them: they are escaped first.
  const inlineCode = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
  const CONTAINER_LABEL = { exercise: "Ejercicio", solution: "Solución", review: "Pregunta", answer: "Respuesta", note: "Nota", bug: "Bug encontrado" };
  const MODE_LABEL = { test: "test de referencia", file: "fichero", diff: "cambio", listing: "fragmento" };
  // A code block longer than this many lines renders inside a closed fold.
  const FOLD_LINES = 30;
  // The header that `bookx` writes for {{cards}}, as the text of its cells.
  const CARDS_HEADER = "Id Caso Por qué Esperado Nivel";
  // The bodies of these containers sit in a closed fold already: a long block inside them stays open.
  const FOLDED_KINDS = new Set(["solution", "answer", "more"]);
  let foldLong = true; // chapterHtml turns it off while it renders the body of a folded container
  let sections = null; // chapterHtml points it at its list while it renders running text
  const FFFD_MARKER = "%%U+FFFD%%";
  // The width at which the styles float the asides into the margin column.
  const MARGIN_QUERY = "(min-width: 1380px)";
  // A heading is the current section once its top is this many pixels from the top of the window, or fewer.
  const SECTION_LINE = 140;

  // ---------- progress: the db capability when the viewer has it, browser storage otherwise ----------
  const LOCAL_KEY = "ki-book-progress-" + EDITION + "-v1";
  function loadLocal() {
    try { const raw = localStorage.getItem(LOCAL_KEY); return raw ? JSON.parse(raw) : {}; } catch { return {}; }
  }
  function saveLocal() {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state.progress)); } catch { /* storage may be blocked */ }
  }
  function chapterProgress(n) {
    const k = key(n);
    if (!state.progress[k]) state.progress[k] = { read: false, exercises: {} };
    return state.progress[k];
  }
  const pendingWrites = new Map();
  function persist(n) {
    saveLocal();
    if (!store.db || !store.uid) return;
    const k = key(n);
    // One write at a time per document: queue the latest body behind any write in flight.
    const body = JSON.parse(JSON.stringify(chapterProgress(n)));
    const prev = pendingWrites.get(k) || Promise.resolve();
    const next = prev.then(() => store.db.collection("data/users/" + store.uid).doc(k).set(body)).catch(() => {
      const el = $("sync");
      if (el) el.textContent = "No se pudo guardar en tu cuenta; queda guardado en este navegador.";
    });
    pendingWrites.set(k, next);
  }
  async function connectStore() {
    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      store.db = db; store.uid = uid;
      db.collection("data/users/" + uid).onSnapshot((snap) => {
        let changed = false;
        for (const doc of snap.docs) {
          if (!doc.id.startsWith(EDITION + "-")) continue;
          const data = doc.data();
          if (!data) continue;
          const remote = { read: !!data.read, exercises: Object.assign({}, data.exercises || {}) };
          if (JSON.stringify(state.progress[doc.id]) !== JSON.stringify(remote)) { state.progress[doc.id] = remote; changed = true; }
        }
        if (changed) { saveLocal(); renderToc(); refreshChapterMarks(); }
      }, () => { /* a dead subscription leaves browser storage in charge */ });
    } catch { /* no runtime: browser storage only */ }
  }

  // ---------- markdown: containers first, then marked, then code captions and folds ----------
  function parseInfo(info) {
    const m = /^(\S*)\s*(.*)$/.exec(info || "");
    const attrs = {};
    (m ? m[2] : "").replace(/(\w+)="([^"]*)"/g, (_, k, v) => { attrs[k] = v.replace(/&quot;/g, '"').replace(/&#96;/g, "`"); return ""; });
    return { lang: m ? m[1] : "", attrs };
  }
  const renderer = new marked.Renderer();
  renderer.code = function (code, info) {
    const { lang, attrs } = parseInfo(info);
    const language = lang === "ki" ? "rust" : lang === "sh" ? "bash" : lang === "goasm" ? "x86asm" : lang;
    let html;
    try {
      html = language && hljs.getLanguage(language) ? hljs.highlight(code, { language, ignoreIllegals: true }).value : esc(code);
    } catch { html = esc(code); }
    const caption = attrs.title || attrs.tag
      ? `<figcaption><span class="path">${esc(attrs.title || "")}</span><span>${attrs.tag ? "en " + esc(attrs.tag) : ""}${attrs.mode && MODE_LABEL[attrs.mode] ? " · " + MODE_LABEL[attrs.mode] : ""} <button class="copy" type="button">Copiar</button></span></figcaption>`
      : `<figcaption><span>${esc(lang || "texto")}</span><button class="copy" type="button">Copiar</button></figcaption>`;
    const figure = `<figure class="code">${caption}<pre><code class="hljs language-${esc(language)}">${html}</code></pre></figure>`;
    if (attrs.mode === "test") {
      return `<details class="fold reftest"><summary>Test de referencia${attrs.title ? " · " + esc(attrs.title) : ""}${attrs.hint ? " · " + esc(attrs.hint) : ""}</summary><div class="fold-body">${figure}</div></details>`;
    }
    // marked hands over the lines between the fences, so a blank last line counts as a line.
    const lines = code.split("\n").length;
    if (foldLong && lines > FOLD_LINES) {
      return `<details class="fold long"><summary>${esc(attrs.title || lang || "texto")} · ${lines} líneas</summary><div class="fold-body">${figure}</div></details>`;
    }
    return figure;
  };
  renderer.table = function (header, body) {
    const table = `<div class="table-wrap"><table><thead>${header}</thead><tbody>${body}</tbody></table></div>`;
    if (header.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim() !== CARDS_HEADER) return table;
    const cases = (body.match(/<tr>/g) || []).length;
    return `<details class="fold cards"><summary>Tarjetas de test · ${cases} casos</summary><div class="fold-body">${table}</div></details>`;
  };
  // The h2 and h3 of the running text get an id and enter the list of sections, not those inside a container.
  renderer.heading = function (text, level) {
    if (!sections || (level !== 2 && level !== 3)) return `<h${level}>${text}</h${level}>\n`;
    const id = "sec-" + (sections.length + 1);
    sections.push({ id, level, html: text });
    return `<h${level} id="${id}">${text}</h${level}>\n`;
  };
  marked.setOptions({ renderer, gfm: true });

  function splitContainers(md) {
    // Returns a list of {kind, arg, text} blocks; plain text has kind "". A ::: line inside a code fence is text.
    // A fence closes only with a line of backticks at least as long as the one that opened it, so a
    // 4-backtick fence can quote a 3-backtick one (the same rule as CommonMark and as `bookx verify`).
    const lines = md.split("\n");
    const blocks = [];
    let current = { kind: "", arg: "", lines: [] };
    let fence = null; // the backticks that opened the fence we are inside, or null
    for (const line of lines) {
      const f = /^(`{3,})/.exec(line);
      if (f) {
        if (fence === null) fence = f[1];
        else if (f[1].length >= fence.length && line.trim().replace(/`/g, "") === "") fence = null;
      }
      if (fence === null && !f) {
        const open = /^:::(\w+)(?:\s+(.*))?$/.exec(line);
        if (open && current.kind === "") {
          blocks.push(current);
          current = { kind: open[1], arg: (open[2] || "").trim(), lines: [] };
          continue;
        }
        if (line.trim() === ":::" && current.kind !== "") {
          blocks.push(current);
          current = { kind: "", arg: "", lines: [] };
          continue;
        }
      }
      current.lines.push(line);
    }
    blocks.push(current);
    return blocks.map((b) => ({ kind: b.kind, arg: b.arg, text: b.lines.join("\n") }));
  }

  function chapterHtml(md) {
    const body = md.replace(/^---\n[\s\S]*?\n---\n/, "");
    let exercise = 0;
    const out = [];
    const list = [];
    for (const b of splitContainers(body)) {
      foldLong = !FOLDED_KINDS.has(b.kind);
      sections = b.kind === "" ? list : null;
      const inner = marked.parse(b.text);
      switch (b.kind) {
        case "": out.push(inner); break;
        case "exercise":
          exercise += 1;
          out.push(`<section class="box exercise" data-ex="${exercise}"><div class="box-label"><span>Ejercicio ${exercise}</span>` +
            `<label class="done-toggle"><input type="checkbox" data-ex="${exercise}"> Hecho</label></div>${inner}</section>`);
          break;
        case "solution": out.push(`<details class="fold"><summary>Solución del ejercicio ${exercise}</summary><div class="fold-body">${inner}</div></details>`); break;
        case "review": out.push(`<section class="box review"><div class="box-label"><span>Pregunta de repaso</span></div>${inner}</section>`); break;
        case "answer": out.push(`<details class="fold"><summary>Respuesta</summary><div class="fold-body">${inner}</div></details>`); break;
        case "more": out.push(`<details class="fold more"><summary>${inlineCode(b.arg)}</summary><div class="fold-body">${inner}</div></details>`); break;
        case "from": out.push(`<aside class="box from" data-lang="${esc(b.arg.toLowerCase())}"><div class="box-label"><span>Si vienes de ${esc(b.arg || "otro lenguaje")}</span></div>${inner}</aside>`); break;
        default: out.push(`<aside class="box ${esc(b.kind)}"><div class="box-label"><span>${esc(CONTAINER_LABEL[b.kind] || b.kind)}</span></div>${inner}</aside>`);
      }
    }
    return { html: out.join("\n"), exercises: exercise, sections: list };
  }

  // ---------- the margin column and the sections of the chapter ----------
  // A float starts where it stands in the flow, so an aside that follows its paragraph would sit beside the next one.
  // On a wide screen it goes just before the paragraph or list it follows; otherwise it goes back to its own place.
  const ASIDE_ANCHORS = new Set(["P", "UL", "OL", "BLOCKQUOTE"]);
  let movedAsides = []; // in the order they were moved, each with the block it follows
  function placeAsides(page, wide) {
    while (movedAsides.length) {
      const { aside, anchor } = movedAsides.pop();
      anchor.after(aside);
    }
    if (!wide) return;
    for (const el of [...page.children]) {
      if (el.tagName !== "ASIDE" || !(el.classList.contains("from") || el.classList.contains("note"))) continue;
      const anchor = el.previousElementSibling;
      if (!anchor || !ASIDE_ANCHORS.has(anchor.tagName)) continue;
      page.insertBefore(el, anchor);
      movedAsides.push({ aside: el, anchor });
    }
  }
  function chapterNavHtml(list, n) {
    if (!list.length) return "";
    const items = list.map((s) => `<li class="level-${s.level}"><a href="#ch${pad(n)}" data-sec="${s.id}">${s.html}</a></li>`);
    return `<h2>En este capítulo</h2><ol>${items.join("")}</ol>`;
  }
  // The index of the last heading past the line, given the tops of the headings in the window; at the end of the page,
  // the last one, because a short last section may never reach the line. -1 if there are no sections.
  function currentSection(tops, atBottom) {
    if (atBottom) return tops.length - 1;
    let current = tops.length ? 0 : -1;
    tops.forEach((top, i) => { if (top <= SECTION_LINE) current = i; });
    return current;
  }
  // Which entries of the list show, for the index of the current section: every h2, and the h3 under the same h2 as it.
  function visibleSections(list, current) {
    let h2 = -1;
    const under = list.map((s) => { if (s.level === 2) h2 += 1; return h2; });
    return list.map((s, i) => s.level === 2 || under[i] === under[current]);
  }
  function markSection() {
    const nav = $("chapter-nav");
    if (nav.hidden) return;
    const tops = state.sections.map((s) => $(s.id).getBoundingClientRect().top);
    const atBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;
    const index = currentSection(tops, atBottom);
    const current = state.sections[index];
    const visible = visibleSections(state.sections, index);
    nav.querySelectorAll("li").forEach((li, i) => { li.hidden = !visible[i]; });
    nav.querySelectorAll("a[data-sec]").forEach((a) => {
      if (a.dataset.sec !== current.id) { a.removeAttribute("aria-current"); return; }
      a.setAttribute("aria-current", "location");
      // The list scrolls by itself when it does not fit in the window; the page must not move for this.
      const box = nav.getBoundingClientRect(), link = a.getBoundingClientRect();
      if (link.top < box.top) nav.scrollTop -= box.top - link.top + 24;
      else if (link.bottom > box.bottom) nav.scrollTop += link.bottom - box.bottom + 24;
    });
  }

  // ---------- views ----------
  function totals() {
    let read = 0, ex = 0, exAvail = 0;
    for (const [n, info] of state.available) {
      const p = state.progress[key(n)];
      if (p && p.read) read += 1;
      if (p) ex += Object.values(p.exercises || {}).filter(Boolean).length;
      exAvail += info.exercises || 0;
    }
    return { read, ex, exAvail };
  }
  function allChapters() { return state.outline ? state.outline.parts.reduce((s, p) => s + p.chapters.length, 0) : 68; }
  function renderOverall() {
    const t = totals();
    const all = allChapters();
    $("ov-read").textContent = `${t.read} / ${all}`;
    $("ov-bar").style.width = `${(100 * t.read / all).toFixed(1)}%`;
    $("ov-ex").textContent = t.exAvail ? `${t.ex} / ${t.exAvail}` : String(t.ex);
    const hours = [...state.available.values()].reduce((s, c) => s + Number(c.hours || 0), 0);
    $("ov-avail").textContent = `${state.available.size} caps. · ${hours} h`;
  }
  function renderToc() {
    if (!state.outline) return;
    $("parts").innerHTML = state.outline.parts.map((part) => {
      const items = part.chapters.map((c) => {
        const avail = state.available.has(c.chapter);
        const p = state.progress[key(c.chapter)];
        if (!avail) return `<li><span class="soon" title="En preparación"><span class="num">${c.chapter}</span><span>${inlineCode(c.title)}</span></span></li>`;
        const cur = state.current === c.chapter ? ' aria-current="page"' : "";
        return `<li class="${p && p.read ? "done" : ""}"><a href="#ch${pad(c.chapter)}"${cur}><span class="num">${c.chapter}</span><span>${inlineCode(c.title)}</span></a></li>`;
      }).join("");
      const open = state.openPart === part.part ? " open" : "";
      return `<details class="part" name="toc-parts" data-part="${esc(part.part)}"${open}><summary title="Parte ${esc(part.part)} · ${esc(part.title)}"><span class="num">${esc(part.part)}</span><span class="name">${esc(part.title)}</span></summary><p class="part-facts">≈ ${part.hours} h → ${esc(part.milestones)}</p><ol>${items}</ol></details>`;
    }).join("");
    renderOverall();
  }
  function renderWelcome() {
    state.current = null;
    $("chapter-nav").hidden = true;
    const t = totals();
    const sorted = [...state.available.keys()].sort((a, b) => a - b);
    const next = sorted.find((n) => !(state.progress[key(n)] || {}).read);
    state.openPart = next ? state.available.get(next).part : state.outline ? state.outline.parts[0].part : null;
    renderToc();
    const cards = sorted.map((n) => {
      const c = state.available.get(n);
      const p = state.progress[key(n)];
      return `<a class="card" href="#ch${pad(n)}"><span class="eyebrow">Capítulo ${n} · ${esc(c.hours)} h${p && p.read ? " · leído" : ""}</span><b>${inlineCode(c.title)}</b><small>${inlineCode(c.milestone)}</small></a>`;
    }).join("");
    const totalHours = state.outline ? state.outline.parts.reduce((s, p) => s + p.hours, 0) : 0;
    const facts = [`${allChapters()} capítulos`, ...(totalHours ? [`≈ ${totalHours} h`] : []), `${state.available.size} disponibles`, `${t.read} leídos`];
    $("page").innerHTML = `<section class="welcome">
      <header class="chapter-head">
        <span class="eyebrow">Edición en Go</span>
        <b class="chapter-num">Ki</b>
        <h1>De cero a experto</h1>
        <p class="lead">Aprendes Go desde cero construyendo, sesión a sesión, el compilador de Ki: un lenguaje funcional con efectos, fibras y tres backends, el último generando ensamblador de Go. Cada sesión termina en verde, con un commit y una etiqueta que puedes comparar con el repositorio de referencia.</p>
        <p class="facts">${facts.join(" · ")}</p>
        ${next ? `<p class="start"><a class="btn" href="#ch${pad(next)}">${t.read ? "Seguir por el capítulo " + next : "Empezar por el capítulo " + next}</a></p>` : `<p class="status">Los capítulos aparecerán aquí a medida que estén escritos y revisados.</p>`}
      </header>
      <div class="cards">${cards}</div>
      <p class="status" id="sync"></p>
    </section>`;
    syncNote();
  }
  function syncNote() {
    const el = $("sync");
    if (el) el.textContent = store.db ? "Tu progreso se guarda en tu cuenta y te sigue entre dispositivos." : "Tu progreso se guarda en este navegador.";
  }
  async function renderChapter(n) {
    const info = state.available.get(n);
    if (!info) { renderWelcome(); return; }
    state.current = n;
    state.openPart = info.part;
    $("chapter-nav").hidden = true;
    renderToc();
    $("page").innerHTML = `<p class="loading">Cargando el capítulo ${n}…</p>`;
    let md = state.chapterCache.get(n);
    if (!md) {
      try {
        const res = await fetch("book/" + info.file);
        if (!res.ok) throw new Error(String(res.status));
        md = (await res.text()).split(FFFD_MARKER).join("\uFFFD");
        state.chapterCache.set(n, md);
      } catch (e) {
        $("page").innerHTML = `<p class="status">No se pudo cargar el capítulo ${n} (${esc(e.message)}). Recarga la página para intentarlo de nuevo.</p>`;
        return;
      }
    }
    if (state.current !== n) return;
    const { html, exercises, sections: list } = chapterHtml(md);
    info.exercises = exercises;
    const sessions = (info.tags || []).filter((t) => t.startsWith("ch" + pad(n) + "-")).length;
    const keys = [...state.available.keys()];
    const prev = keys.filter((k) => k < n).sort((a, b) => b - a)[0];
    const nextCh = keys.filter((k) => k > n).sort((a, b) => a - b)[0];
    const part = state.outline.parts.find((p) => p.part === info.part);
    const facts = [`${esc(info.hours)} h`, ...(sessions ? [sessions === 1 ? "1 sesión" : `${sessions} sesiones`] : [])];
    $("page").innerHTML = `<header class="chapter-head">
        <span class="eyebrow">Parte ${esc(info.part)}${part ? " · " + esc(part.title) : ""}</span>
        <b class="chapter-num" aria-label="Capítulo ${n}">${n}</b>
        <h1>${inlineCode(info.title)}</h1>
        <p class="facts">${facts.join(" · ")}</p>
        ${info.milestone ? `<p class="milestone"><span>Hito</span> ${inlineCode(info.milestone)}</p>` : ""}
      </header>
      ${html}
      <div class="end">
        <span class="status" id="end-status"></span>
        <span class="end-actions">
          ${prev ? `<a class="btn secondary" href="#ch${pad(prev)}">← Capítulo ${prev}</a>` : ""}
          <button class="btn" id="mark-read" type="button"></button>
          ${nextCh ? `<a class="btn secondary" href="#ch${pad(nextCh)}">Capítulo ${nextCh} →</a>` : ""}
        </span>
      </div>`;
    movedAsides = [];
    placeAsides($("page"), window.matchMedia(MARGIN_QUERY).matches);
    state.sections = list;
    $("chapter-nav").innerHTML = chapterNavHtml(list, n);
    $("chapter-nav").hidden = !list.length;
    refreshChapterMarks();
    renderOverall();
    window.scrollTo(0, 0);
    markSection();
  }
  function refreshChapterMarks() {
    const n = state.current;
    if (!n) return;
    const p = chapterProgress(n);
    document.querySelectorAll("section.exercise").forEach((sec) => {
      const on = !!(p.exercises || {})[sec.dataset.ex];
      sec.classList.toggle("is-done", on);
      const box = sec.querySelector("input[type=checkbox]");
      if (box) box.checked = on;
    });
    const btn = $("mark-read");
    if (btn) btn.textContent = p.read ? "Leído ✓ (desmarcar)" : "Marcar como leído";
    const st = $("end-status");
    if (st) {
      const doneEx = Object.values(p.exercises || {}).filter(Boolean).length;
      const total = (state.available.get(n) || {}).exercises || 0;
      st.textContent = `${doneEx} de ${total} ejercicios hechos` + (store.db ? " · guardado en tu cuenta" : " · guardado en este navegador");
    }
  }

  // ---------- events ----------
  document.addEventListener("change", (ev) => {
    const box = ev.target.closest && ev.target.closest("section.exercise input[type=checkbox]");
    if (!box || !state.current) return;
    const p = chapterProgress(state.current);
    p.exercises = Object.assign({}, p.exercises, { [box.dataset.ex]: box.checked });
    persist(state.current);
    refreshChapterMarks(); renderToc();
  });
  document.addEventListener("click", (ev) => {
    // The hash names the chapter (route), so the list of sections scrolls without touching it.
    const section = ev.target.closest && ev.target.closest("a[data-sec]");
    if (section) {
      ev.preventDefault();
      $(section.dataset.sec).scrollIntoView();
      return;
    }
    const copy = ev.target.closest && ev.target.closest("button.copy");
    if (copy) {
      const pre = copy.closest("figure").querySelector("pre");
      navigator.clipboard.writeText(pre.innerText).then(() => { copy.textContent = "Copiado"; setTimeout(() => (copy.textContent = "Copiar"), 1500); })
        .catch(() => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); });
      return;
    }
    if (ev.target.id === "mark-read" && state.current) {
      const p = chapterProgress(state.current);
      p.read = !p.read;
      persist(state.current);
      refreshChapterMarks(); renderToc();
    }
  });
  // A part opened by hand stays open when the contents are drawn again; opening one closes the others (name="toc-parts").
  document.addEventListener("toggle", (ev) => {
    if (!ev.target.matches || !ev.target.matches("details.part")) return;
    if (ev.target.open) state.openPart = ev.target.dataset.part;
    else if (state.openPart === ev.target.dataset.part) state.openPart = null;
  }, true);
  function route() {
    const m = /^#ch(\d{2})$/.exec(location.hash);
    if (m) renderChapter(Number(m[1])); else renderWelcome();
  }
  window.addEventListener("hashchange", route);
  // A browser fires scroll at most once per frame, and this only reads the tops of a few headings.
  window.addEventListener("scroll", markSection, { passive: true });
  window.addEventListener("resize", markSection);

  // ---------- boot ----------
  async function boot() {
    state.progress = loadLocal();
    window.matchMedia(MARGIN_QUERY).addEventListener("change", (ev) => placeAsides($("page"), ev.matches));
    try {
      const [outline, manifest] = await Promise.all([
        fetch("book/outline.json").then((r) => r.json()),
        fetch("book/manifest.json").then((r) => r.json()),
      ]);
      state.outline = outline; state.manifest = manifest;
      const counts = outline.exercises || {};
      for (const c of manifest.chapters) state.available.set(c.chapter, Object.assign({ exercises: counts[String(c.chapter)] || 0 }, c));
    } catch (e) {
      $("page").innerHTML = `<p class="status">No se pudo cargar el índice del libro (${esc(e.message)}). Recarga la página.</p>`;
      return;
    }
    route();
    connectStore().then(() => { syncNote(); refreshChapterMarks(); renderOverall(); });
  }
  boot();
})();
</script>
